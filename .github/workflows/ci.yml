name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  static:
    name: parse and lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install the two checkers
        run: python -m pip install --disable-pip-version-check pyflakes
      - name: every python file must parse
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = []
          for path in sorted(pathlib.Path("feroku").rglob("*.py")):
              try:
                  ast.parse(path.read_text(encoding="utf-8"))
              except SyntaxError as error:
                  bad.append(f"{path}:{error.lineno}: {error.msg}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("all python files parse")
          PY
      - name: pyflakes must not report undefined names
        run: |
          python - <<'PY'
          import subprocess, sys
          result = subprocess.run([sys.executable, "-m", "pyflakes", "feroku"], capture_output=True, text=True)
          lines = [line for line in (result.stdout + result.stderr).splitlines() if line.strip()]
          undefined = [line for line in lines if "undefined name" in line]
          for line in lines:
              print(line)
          if undefined:
              print("undefined names are fatal")
              sys.exit(1)
          print(f"{len(lines)} warnings, none fatal")
          PY
      - name: byte compile the package
        run: python -m compileall -q feroku

  policy:
    name: root policy and secret hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: the installer must not turn the bot into a system service silently
        run: |
          python - <<'PY'
          import pathlib, sys
          source = pathlib.Path("feroku/main.py").read_text(encoding="utf-8")
          bad = []
          if "/etc/systemd/system" in source:
              bad.append("main.py still writes a unit into /etc/systemd/system")
          if "multi-user.target" in source:
              bad.append("main.py still installs to multi-user.target")
          for number, line in enumerate(source.split("\n"), 1):
              if '"systemctl"' in line and '"--user"' not in line:
                  bad.append(f"main.py:{number}: systemctl without --user")
              if "sudo" in line and "enable-linger" in line:
                  bad.append(f"main.py:{number}: sudo used to enable linger")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("the bot stays a user level service")
          PY
      - name: secrets must be written private
        run: |
          python - <<'PY'
          import pathlib, re, sys
          source = pathlib.Path("feroku/main.py").read_text(encoding="utf-8")
          bad = []
          if "CONFIG_PATH.chmod(0o600)" not in source:
              bad.append("the config file is not chmodded 0600")
          if "SESSIONS_DIR" not in source:
              bad.append("the session directory constant is gone")
          elif "os.makedirs(SESSIONS_DIR, exist_ok=True)" in source and "0o700" not in source:
              bad.append("the session directory is created with the default umask")
          for path in sorted(pathlib.Path("feroku").rglob("*.py")):
              for number, line in enumerate(path.read_text(encoding="utf-8").split("\n"), 1):
                  if re.search(r"(?i)\b(token|api_hash|api_id)\s*=\s*\"[A-Za-z0-9:_-]{16,}\"", line):
                      bad.append(f"{path}:{number}: hardcoded credential")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("secret handling is sane")
          PY
      - name: tokens must come from a cryptographic source
        run: |
          python - <<'PY'
          import pathlib, sys
          source = pathlib.Path("feroku/utils/other.py").read_text(encoding="utf-8")
          if "def rand(" not in source:
              print("utils.rand is gone, update this check")
              sys.exit(1)
          body = source[source.index("def rand("):]
          end = body.find("\n\n\n")
          body = body if end < 0 else body[:end]
          if "random.choice" in body:
              print("utils.rand uses random.choice, it guards the sudo password token too")
              print("use secrets.choice from the same alphabet, the signature stays the same")
              sys.exit(1)
          print("utils.rand is cryptographic")
          PY
